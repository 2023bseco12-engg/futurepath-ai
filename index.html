/* documented scoring: 70% skill/trait fit + 20% industry overlap + 10% work-style match */
function score(c,a){
 const sw=c.p.reduce((s,x)=>s+x,0);
 const fit=1-c.p.reduce((s,x,i)=>s+x*Math.abs(a.r[i]-x),0)/(4*sw);
 const ov=a.inds.length?Math.min(1,c.inds.filter(i=>a.inds.includes(i)).length/Math.min(3,a.inds.length)):0.5;
 const env=c.env.includes(a.env)?1:0.5;
 return {fit,ov,env,total:Math.round((0.7*fit+0.2*ov+0.1*env)*100)};
}
const PHASES=[['d30','First 30 days'],['d60','60 days'],['d90','90 days'],['m6','6 months'],['m12','12 months']];

/* ---------- AUTH ---------- */
function Auth({S,mode}){
 const reg=mode==='register';
 const [f,setF]=useState({name:'',email:'',password:'',country:'Pakistan',level:'Undergraduate',uni:'',major:'',year:'2027'});
 const [e,setE]=useState({});const [msg,setMsg]=useState('');const [busy,setBusy]=useState(false),[info,setInfo]=useState('');
 const set=k=>ev=>setF({...f,[k]:ev.target.value});
 const submit=async ev=>{ev.preventDefault();const x={};
  if(reg&&f.name.trim().length<2)x.name='Enter your full name.';
  if(!/^\S+@\S+\.\S+$/.test(f.email))x.email='Enter a valid email address.';
  if(reg&&!pwOk(f.password))x.password='Use 8+ characters with a lowercase letter, an uppercase letter and a number.';else if(f.password.length<8)x.password='Use at least 8 characters.';
  if(reg){if(!f.uni.trim())x.uni='Required.';if(!f.major.trim())x.major='Required.'}
  setE(x);setMsg('');setInfo('');if(Object.keys(x).length)return;
  if(S.cloud){setBusy(true);const r=await S.cloudAuth(reg,f);setBusy(false);if(r.msg)setMsg(r.msg);if(r.ok)setInfo(r.ok);return}
  if(reg){S.wipe();S.setUser({name:f.name.trim(),email:f.email.trim().toLowerCase()});S.setProfile({...S.blank,country:f.country,level:f.level,uni:f.uni,major:f.major,year:f.year});S.setOn(true);S.act('Account created');S.go('dashboard')}
  else{if(S.user&&S.user.email===f.email.trim().toLowerCase()){S.setOn(true);S.act('Logged in');S.go('dashboard')}else setMsg('No demo account with this email in this browser. Register first, or use the demo account.')}};
 return <div className="grid min-h-screen md:grid-cols-2 fade">
  <div className="hidden bg-gradient-to-br from-navy to-[#0f5c68] p-10 text-white md:flex md:flex-col md:justify-between"><Logo dark/><div><h2 className="text-3xl font-bold">Find the path that fits you.</h2><p className="mt-2 text-slate-200">Take the assessment, see your matches and start your roadmap.</p></div><p className="text-xs text-slate-300">{S.cloud?'Secure sign-in powered by Supabase.':'Demo mode: accounts exist only in this browser.'}</p></div>
  <div className="flex items-center justify-center p-6"><form onSubmit={submit} className="w-full max-w-md space-y-3" noValidate>
   <button type="button" className="text-sm text-brand" onClick={()=>S.go('home')}>← Back to home</button>
   <h1 className="text-2xl font-bold text-navy">{reg?'Create your student account':'Welcome back'}</h1>
   {reg&&<Fld label="Full name" err={e.name}><input className={inp} value={f.name} onChange={set('name')}/></Fld>}
   <Fld label="Email" err={e.email}><input className={inp} type="email" value={f.email} onChange={set('email')}/></Fld>
   <Fld label="Password" err={e.password}><input className={inp} type="password" value={f.password} onChange={set('password')}/></Fld>
   {reg&&<><div className="grid grid-cols-2 gap-3"><Fld label="Country"><select className={inp} value={f.country} onChange={set('country')}>{['Pakistan','Other'].map(x=><option key={x}>{x}</option>)}</select></Fld>
   <Fld label="Education level"><select className={inp} value={f.level} onChange={set('level')}>{['Undergraduate','Graduate','Postgraduate','Fresh graduate'].map(x=><option key={x}>{x}</option>)}</select></Fld></div>
   <Fld label="University or college" err={e.uni}><input className={inp} value={f.uni} onChange={set('uni')}/></Fld>
   <div className="grid grid-cols-2 gap-3"><Fld label="Degree and major" err={e.major}><input className={inp} value={f.major} onChange={set('major')}/></Fld>
   <Fld label="Graduation year"><select className={inp} value={f.year} onChange={set('year')}>{[2025,2026,2027,2028,2029,2030].map(x=><option key={x}>{x}</option>)}</select></Fld></div></>}
   {msg&&<p className="rounded-lg bg-red-50 p-2 text-sm text-red-700">{msg}</p>}{info&&<p className="rounded-lg bg-brand-50 p-2 text-sm text-brand">{info}</p>}
   <B className="w-full" type="submit" disabled={busy}>{busy?'Please wait…':reg?'Create account':'Log in'}</B>
   {!reg&&<button type="button" className="block w-full text-center text-sm text-brand" onClick={()=>S.go('forgot')}>Forgot password?</button>}
   {!S.cloud&&<B v="o" className="w-full" type="button" onClick={()=>S.demo()}>Use demo account</B>}
   <p className="text-center text-sm text-slate-600">{reg?'Already registered? ':'New here? '}<button type="button" className="font-semibold text-brand" onClick={()=>S.go(reg?'login':'register')}>{reg?'Log in':'Create an account'}</button></p>
   {!S.cloud&&<p className="text-xs text-slate-500">Demo only: your password is checked but never saved.</p>}</form></div></div>;
}

const Empty=({S,t,b,to})=><Card className="py-12 text-center"><p className="mb-4 text-slate-600">{t}</p><B onClick={()=>S.go(to)}>{b}</B></Card>;

/* ---------- PROFILE ---------- */
const PF=['country','level','uni','major','year','subjects','exp','certs','short','long'];
const pct=p=>Math.round((PF.filter(k=>p[k]&&String(p[k]).trim()).length+(p.interests.length?1:0)+(Object.keys(p.skills).length?1:0))/12*100);
function Profile({S}){
 const p=S.profile,[ns,setNs]=useState(''),[nl,setNl]=useState(3),[ok,setOk]=useState(false),[dc,setDc]=useState(false);
 const set=k=>ev=>{setOk(false);S.setProfile({...p,[k]:ev.target.value})};
 const addS=()=>{const n=ns.trim();if(n){S.setProfile({...p,skills:{...p.skills,[n]:+nl}});setNs('')}};
 const tgl=i=>S.setProfile({...p,interests:p.interests.includes(i)?p.interests.filter(x=>x!==i):[...p.interests,i]});
 return <Shell S={S} page="profile"><Head t="My Profile" s={'Profile completion: '+pct(p)+'%'}><B onClick={async()=>{const e=await S.saveProfile();if(e){setOk('Could not save: '+e);return}S.act('Profile saved');setOk(true)}}>Save profile</B></Head>
 {ok&&<p className="mb-4 rounded-lg bg-brand-50 p-2 text-sm text-brand">{ok===true?(S.cloud?'Profile saved to your account.':'Profile saved in this browser.'):ok}</p>}
 <div className="grid gap-4 md:grid-cols-2">
 <Card className="space-y-3"><h2 className="font-bold text-navy">Account</h2><Fld label="Name"><input className={inp} value={S.user.name} onChange={ev=>S.setUser({...S.user,name:ev.target.value})}/></Fld><p className="text-sm text-slate-600">Email: {S.user.email}</p>
  <Fld label="Country"><select className={inp} value={p.country} onChange={set('country')}>{['','Pakistan','Other'].map(x=><option key={x}>{x}</option>)}</select></Fld>
  <Fld label="Education level"><select className={inp} value={p.level} onChange={set('level')}>{['','Undergraduate','Graduate','Postgraduate','Fresh graduate'].map(x=><option key={x}>{x}</option>)}</select></Fld></Card>
 <Card className="space-y-3"><h2 className="font-bold text-navy">Academic background</h2>{[['uni','University or college'],['major','Degree and major'],['year','Graduation year'],['subjects','Subjects you enjoy']].map(([k,l])=><Fld key={k} label={l}><input className={inp} value={p[k]} onChange={set(k)}/></Fld>)}</Card>
 <Card><h2 className="mb-2 font-bold text-navy">Interests</h2><div className="flex flex-wrap gap-2">{INDS.map(i=><Chip key={i} on={p.interests.includes(i)} onClick={()=>tgl(i)}>{i}</Chip>)}</div></Card>
 <Card><h2 className="mb-2 font-bold text-navy">Skills (self-rated 1–5)</h2><div className="mb-3 flex gap-2"><input className={inp} placeholder="e.g. Excel" value={ns} onChange={ev=>setNs(ev.target.value)} onKeyDown={ev=>ev.key==='Enter'&&addS()}/><select className={inp+' !w-20'} value={nl} onChange={ev=>setNl(ev.target.value)}>{[1,2,3,4,5].map(x=><option key={x}>{x}</option>)}</select><B onClick={addS}>Add</B></div>
  {Object.keys(p.skills).length?<div className="flex flex-wrap gap-2">{Object.entries(p.skills).map(([k,v])=><span key={k} className="rounded-full bg-mist px-3 py-1 text-sm">{k} · {v}/5 <button aria-label={'Remove '+k} className="ml-1 text-red-600" onClick={()=>{const s={...p.skills};delete s[k];S.setProfile({...p,skills:s})}}>×</button></span>)}</div>:<p className="text-sm text-slate-500">No skills yet. Add your first one above.</p>}</Card>
 <Card className="space-y-3 md:col-span-2"><h2 className="font-bold text-navy">Experience and goals</h2>
  {[['exp','Work experience'],['certs','Certifications'],['short','Short-term goal (1 year)'],['long','Long-term goal (5 years)']].map(([k,l])=><Fld key={k} label={l}><textarea rows="2" className={inp} value={p[k]} onChange={set(k)}/></Fld>)}</Card></div>
 <Card className="mt-4 border-red-200"><h2 className="font-bold text-navy">Delete my account</h2><p className="my-2 text-sm text-slate-600">This permanently removes your account and all your saved data. It cannot be undone.</p><B v="o" className="!border-red-300 !text-red-700" onClick={async()=>{if(!dc){setDc(true);return}const e=await S.delAcct();if(e)setOk('Could not delete: '+e)}}>{dc?'Click again to permanently delete':'Delete my account'}</B></Card></Shell>;
}

/* ---------- DISCOVERY ---------- */
function Discover({S}){
 const init=S.ans||{r:[3,3,3,3,3,3,3],inds:[],env:'Office',subjects:'',goal:''};
 const [a,setA]=useState(init),[st,setSt]=useState(0),[er,setEr]=useState('');
 const next=()=>{if(st===1&&!a.inds.length){setEr('Pick at least one industry.');return}setEr('');setSt(st+1)};
 const fin=()=>{S.setAns(a);S.act('Completed career assessment');S.go('results')};
 return <Shell S={S} page="discover"><Head t="AI Career Discovery" s={'Step '+(st+1)+' of 3 · takes about 2 minutes'}/><Bar pct={(st+1)/3*100}/>
 <Card className="mt-4">
 {st===0&&<div className="space-y-4"><h2 className="font-bold text-navy">How strong are you in each area?</h2><p className="text-sm text-slate-600">1 = just starting, 5 = very strong. Be honest: this makes your results better.</p>
  {DIMS.map((d,i)=><div key={d}><div className="flex justify-between text-sm"><span>{d}</span><b>{a.r[i]}</b></div><input type="range" min="1" max="5" value={a.r[i]} className="w-full accent-teal-600" onChange={ev=>setA({...a,r:a.r.map((x,j)=>j===i?+ev.target.value:x)})}/></div>)}</div>}
 {st===1&&<div className="space-y-4"><h2 className="font-bold text-navy">Which industries interest you?</h2><div className="flex flex-wrap gap-2">{INDS.map(i=><Chip key={i} on={a.inds.includes(i)} onClick={()=>setA({...a,inds:a.inds.includes(i)?a.inds.filter(x=>x!==i):[...a.inds,i]})}>{i}</Chip>)}</div>
  <h2 className="font-bold text-navy">Preferred working environment</h2><div className="flex flex-wrap gap-2">{ENVS.map(i=><Chip key={i} on={a.env===i} onClick={()=>setA({...a,env:i})}>{i}</Chip>)}</div></div>}
 {st===2&&<div className="space-y-4"><h2 className="font-bold text-navy">Almost done</h2><Fld label="Your strongest subjects"><input className={inp} value={a.subjects} onChange={ev=>setA({...a,subjects:ev.target.value})}/></Fld><Fld label="Your career goal in your own words"><textarea rows="3" className={inp} value={a.goal} onChange={ev=>setA({...a,goal:ev.target.value})}/></Fld><p className="text-xs text-slate-500">These two answers are saved for you but not used in the score (see the method on the results page).</p></div>}
 {er&&<p className="mt-3 text-sm text-red-600">{er}</p>}
 <div className="mt-6 flex justify-between"><B v="o" disabled={!st} onClick={()=>setSt(st-1)}>Back</B>{st<2?<B onClick={next}>Next</B>:<B onClick={fin}>See my careers</B>}</div></Card></Shell>;
}

/* ---------- RESULTS ---------- */
function Results({S}){
 const [open,setOpen]=useState(null);
 if(!S.ans)return <Shell S={S} page="results"><Head t="Career Recommendations"/><Empty S={S} t="You have not taken the assessment yet." b="Start assessment" to="discover"/></Shell>;
 const rk=CAREERS.map(c=>({c,s:score(c,S.ans)})).sort((x,y)=>y.s.total-x.s.total).slice(0,5);
 return <Shell S={S} page="results"><Head t="Your Top 5 Careers" s="Calculated from your answers with a fixed formula"><B v="o" onClick={()=>S.go('discover')}>Retake assessment</B></Head>
 <Card className="mb-4 border-brand bg-brand-50 text-sm"><b className="text-navy">How match % is calculated</b><p className="mt-1 text-slate-700">Match = 70% skill fit + 20% industry overlap + 10% work-style match. Skill fit compares your 7 self-ratings with each career’s sample profile; traits that matter more for a career count more. No AI is used for the numbers. Career profiles here are <b>sample data</b> written for the prototype. Results are guidance, not guaranteed predictions.</p></Card>
 <div className="space-y-4">{rk.map(({c,s},i)=>{const why=c.p.map((v,j)=>[j,v]).filter(([j])=>Math.abs(S.ans.r[j]-c.p[j])<=1).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([j])=>DIMS[j].toLowerCase());const ind=c.inds.filter(x=>S.ans.inds.includes(x));
 return <Card key={c.id}><div className="flex items-center justify-between gap-3"><div><span className="text-xs font-semibold text-brand">#{i+1}</span><h2 className="text-lg font-bold text-navy">{c.t}</h2></div><div className="text-2xl font-extrabold text-navy">{s.total}%</div></div>
  <div className="my-2"><Bar pct={s.total}/></div><p className="text-sm text-slate-700">{c.d}</p>
  <p className="mt-2 text-sm"><b>Why it matches:</b> {why.length?'your ratings closely fit this career’s needs for '+why.join(' and ')+'. ':''}{ind.length?'You selected '+ind.join(', ')+'.':'It does not overlap with your chosen industries.'}</p>
  {open===c.id&&<div className="mt-3 grid gap-3 border-t pt-3 text-sm md:grid-cols-2 fade"><div><b>Required qualifications</b><p>{c.q}</p><b className="mt-2 block">Essential skills</b><p>{c.sk.map(x=>x[0]).join(', ')}</p><b className="mt-2 block">Career opportunities</b><p>{c.jobs}</p></div><div><b>Industries</b><p>{c.inds.join(', ')}</p><b className="mt-2 block">Suggested next steps</b><ul className="list-disc pl-5">{c.next.map(n=><li key={n}>{n}</li>)}</ul><b className="mt-2 block">Score breakdown</b><p>Skill fit {Math.round(s.fit*100)}% · Industry {Math.round(s.ov*100)}% · Work style {Math.round(s.env*100)}%</p></div></div>}
  <div className="mt-3 flex flex-wrap gap-2"><B v="o" onClick={()=>setOpen(open===c.id?null:c.id)}>{open===c.id?'Hide details':'View details'}</B><B onClick={()=>{S.setGoal(c.id);S.act('Set career goal: '+c.t);S.go('gap')}}>Set as my goal</B>{S.goal===c.id&&<span className="self-center text-sm font-semibold text-brand">✓ Current goal</span>}</div></Card>})}</div></Shell>;
}
const Picker=({S})=><select className={inp+' !w-auto'} value={S.goal||''} onChange={ev=>{S.setGoal(ev.target.value);S.act('Set career goal: '+byId(ev.target.value).t)}}><option value="" disabled>Choose a career</option>{CAREERS.map(c=><option key={c.id} value={c.id}>{c.t}</option>)}</select>;

/* ---------- SKILL GAP ---------- */
function Gap({S}){
 const c=byId(S.goal),sk=S.profile.skills;
 return <Shell S={S} page="gap"><Head t="Skill Gap Analyzer" s="Rate yourself, then see what to learn first"><Picker S={S}/></Head>
 {!c?<Card className="py-10 text-center text-slate-600">Choose a career above to compare your skills.</Card>:(()=>{
  const rows=c.sk.map(([n,req,pr])=>{const kk=Object.keys(sk).find(x=>x.toLowerCase()===n.toLowerCase()),have=kk?sk[kk]:0,gap=Math.max(0,req-have);return{n,k:kk||n,req,pr,have,gap,pri:gap>=3?'High':gap===2?'Medium':gap===1?'Low':'Met'}});
  const rd=Math.round(rows.reduce((s,r)=>s+Math.min(r.have,r.req),0)/rows.reduce((s,r)=>s+r.req,0)*100);
  const col={High:'bg-red-100 text-red-700',Medium:'bg-amber-100 text-amber-800',Low:'bg-sky-100 text-sky-700',Met:'bg-emerald-100 text-emerald-700'};
  return <><Card className="mb-4 flex items-center gap-5"><Ring pct={rd}/><div><h2 className="font-bold text-navy">{c.t}: skill readiness</h2><p className="text-sm text-slate-600">{rows.filter(r=>r.gap>0).length} of {rows.length} skills need work. Required levels are <b>sample data</b>.</p><div className="mt-2 flex gap-4 text-xs"><span className="flex items-center gap-1"><i className="h-2.5 w-4 rounded bg-navy"/>Required</span><span className="flex items-center gap-1"><i className="h-2.5 w-4 rounded bg-brand"/>You</span></div></div></Card>
  <div className="space-y-3">{rows.map(r=><Card key={r.n}><div className="flex flex-wrap items-center justify-between gap-2"><b className="text-navy">{r.n}</b><span className={'rounded-full px-2 py-0.5 text-xs font-semibold '+col[r.pri]}>{r.pri==='Met'?'Skill met':r.pri+' priority'}</span></div>
   <div className="my-2 space-y-1"><Bar pct={r.req*20} color="bg-navy"/><Bar pct={r.have*20}/></div>
   <label className="flex items-center gap-3 text-sm">Your level: <b>{r.have}/5</b><input type="range" min="0" max="5" value={r.have} className="flex-1 accent-teal-600" onChange={ev=>{const v=+ev.target.value,s={...sk};if(v)s[r.k]=v;else delete s[r.k];S.setProfile({...S.profile,skills:s})}}/></label>
   {r.gap>0&&<div className="mt-2 grid gap-1 text-sm text-slate-700 md:grid-cols-2"><p><b>Learn:</b> search “{r.n} for beginners” on Coursera, edX or YouTube <span className="text-xs text-slate-400">(suggestion, not a verified course)</span></p><p><b>Practice project:</b> {r.pr}</p></div>}</Card>)}</div>
  <B className="mt-4" onClick={()=>S.go('roadmap')}>Build my roadmap →</B></>})()}</Shell>;
}

/* ---------- ROADMAP ---------- */
function Roadmap({S}){
 const c=byId(S.goal);
 const tk=c?tasks(c):null,all=c?PHASES.flatMap(([k])=>tk[k].map((_,i)=>c.id+':'+k+':'+i)):[];
 const n=all.filter(k=>S.done[k]).length,p=all.length?Math.round(n/all.length*100):0;
 return <Shell S={S} page="roadmap"><Head t="Career Roadmap" s="Tick activities as you finish them"><Picker S={S}/></Head>
 {!c?<Card className="py-10 text-center text-slate-600">Choose a career above to see your roadmap.</Card>:<>
 <Card className="mb-4 flex items-center gap-5"><Ring pct={p}/><div><h2 className="font-bold text-navy">{c.t} roadmap</h2><p className="text-sm text-slate-600">{n} of {all.length} activities done. Template plan (<Demo/>); AI-personalised plans arrive in Stage 3.</p></div></Card>
 <div className="space-y-4">{PHASES.map(([k,l])=>{const dn=tk[k].filter((_,i)=>S.done[c.id+':'+k+':'+i]).length;return <Card key={k}><div className="mb-2 flex justify-between"><h3 className="font-bold text-navy">{l}</h3><span className="text-sm text-slate-500">{dn}/{tk[k].length}</span></div>
  {tk[k].map((t,i)=>{const key=c.id+':'+k+':'+i;return <label key={key} className="flex cursor-pointer items-start gap-3 rounded-lg px-2 py-2 hover:bg-mist"><input type="checkbox" className="mt-1 h-4 w-4 accent-teal-600" checked={!!S.done[key]} onChange={()=>{S.setDone({...S.done,[key]:!S.done[key]});if(!S.done[key])S.act('Completed: '+t)}}/><span className={'text-sm '+(S.done[key]?'text-slate-400 line-through':'')}>{t}</span></label>})}</Card>})}</div></>}</Shell>;
}

/* ---------- DASHBOARD ---------- */
function Dash({S}){
 const c=byId(S.goal),p=S.profile;
 const rk=S.ans?CAREERS.map(x=>({c:x,s:score(x,S.ans).total})).sort((a,b)=>b.s-a.s).slice(0,3):[];
 let rp=0;if(c){const t=tasks(c),all=PHASES.flatMap(([k])=>t[k].map((_,i)=>c.id+':'+k+':'+i));rp=Math.round(all.filter(k=>S.done[k]).length/all.length*100)}
 return <Shell S={S} page="dashboard"><Head t={'Welcome, '+S.user.name.split(' ')[0]+' 👋'} s="Here is your career progress at a glance"/>
 <div className="mb-4 flex flex-wrap gap-2">{[['Take assessment','discover'],['Update profile','profile'],['Analyse skills','gap'],['Open roadmap','roadmap']].map(([l,t])=><B key={t} v={t==='discover'?'p':'o'} onClick={()=>S.go(t)}>{l}</B>)}</div>
 <div className="grid gap-4 md:grid-cols-3">
  <Card className="text-center"><p className="mb-2 text-sm font-semibold text-slate-600">Profile completion</p><div className="flex justify-center"><Ring pct={pct(p)}/></div></Card>
  <Card className="text-center"><p className="mb-2 text-sm font-semibold text-slate-600">Roadmap progress</p><div className="flex justify-center"><Ring pct={rp}/></div></Card>
  <Card><p className="text-sm font-semibold text-slate-600">Career goal</p>{c?<><p className="mt-2 text-xl font-bold text-navy">{c.t}</p><p className="text-sm text-slate-600">{c.d}</p></>:<p className="mt-2 text-sm text-slate-500">No goal selected yet. Pick one from your recommendations.</p>}</Card>
  <Card className="md:col-span-2"><div className="mb-2 flex justify-between"><b className="text-navy">Career recommendations</b><button className="text-sm text-brand" onClick={()=>S.go(S.ans?'results':'discover')}>{S.ans?'See all':'Start'}</button></div>
   {rk.length?rk.map(({c:x,s})=><div key={x.id} className="mb-2"><div className="flex justify-between text-sm"><span>{x.t}</span><b>{s}%</b></div><Bar pct={s}/></div>):<p className="text-sm text-slate-500">Take the assessment to see your top matches.</p>}</Card>
  <Card><b className="text-navy">CV status</b><p className="mt-2 text-sm text-slate-600">{LS.get('cv',null)?'Draft saved in this browser.':'Not started.'} <button className="text-brand" onClick={()=>S.go('cv')}>Open CV Builder</button></p><b className="mt-3 block text-navy">Saved opportunities</b><p className="mt-1 text-sm text-slate-600">{S.sv.s.length} scholarships · {S.sv.i.length} internships</p><div className="mt-1 flex gap-3 text-sm text-brand"><button onClick={()=>S.go('scholar')}>Scholarships</button><button onClick={()=>S.go('intern')}>Internships</button></div></Card>
  <Card className="md:col-span-3"><b className="text-navy">Explore Global Opportunities</b><p className="mt-1 text-sm text-slate-600">{OPPS.filter(o=>o.k==='s').length} international scholarships and {OPPS.filter(o=>o.k==='i').length} international internship programmes with official links. Open or rolling right now: {OPPS.filter(o=>o.st==='Open'||o.st==='Rolling').length}.</p><div className="mt-2 flex flex-wrap gap-2"><B onClick={()=>S.go('scholar')}>International Scholarships</B><B v="o" onClick={()=>S.go('intern')}>International Internships</B></div></Card>
  <Card className="md:col-span-3"><b className="text-navy">Recent activity</b>{S.acts.length?<ul className="mt-2 space-y-1 text-sm text-slate-700">{S.acts.slice(0,5).map((a,i)=><li key={i}>• {a.t} <span className="text-xs text-slate-400">{a.d}</span></li>)}</ul>:<p className="mt-2 text-sm text-slate-500">Nothing yet. Your actions will appear here.</p>}</Card></div></Shell>;
}

/* documented scoring: 70% skill/trait fit + 20% industry overlap + 10% work-style match */
function score(c,a){
 const sw=c.p.reduce((s,x)=>s+x,0);
 const fit=1-c.p.reduce((s,x,i)=>s+x*Math.abs(a.r[i]-x),0)/(4*sw);
 const ov=a.inds.length?Math.min(1,c.inds.filter(i=>a.inds.includes(i)).length/Math.min(3,a.inds.length)):0.5;
 const env=c.env.includes(a.env)?1:0.5;
 return {fit,ov,env,total:Math.round((0.7*fit+0.2*ov+0.1*env)*100)};
}

/* ---------- AUTH ---------- */
function Auth({S,mode}){
 const reg=mode==='register';
 const [f,setF]=useState({name:'',email:'',password:'',country:'Pakistan',level:'Undergraduate',uni:'',major:'',year:'2027'});
 const [e,setE]=useState({});const [msg,setMsg]=useState('');const [busy,setBusy]=useState(false),[info,setInfo]=useState('');
 const set=k=>ev=>setF({...f,[k]:ev.target.value});
 const submit=async ev=>{ev.preventDefault();const x={};
  if(reg&&f.name.trim().length<2)x.name='Enter your full name.';
  if(!/^\S+@\S+\.\S+$/.test(f.email))x.email='Enter a valid email address.';
  if(reg&&!pwOk(f.password))x.password='Use 8+ characters with a lowercase letter, an uppercase letter and a number.';else if(f.password.length<8)x.password='Use at least 8 characters.';
  if(reg){if(!f.uni.trim())x.uni='Required.';if(!f.major.trim())x.major='Required.'}
  setE(x);setMsg('');setInfo('');if(Object.keys(x).length)return;
  if(S.cloud){setBusy(true);const r=await S.cloudAuth(reg,f);setBusy(false);if(r.msg)setMsg(r.msg);if(r.ok)setInfo(r.ok);return}
  if(reg){S.wipe();S.setUser({name:f.name.trim(),email:f.email.trim().toLowerCase()});S.setProfile({...S.blank,country:f.country,level:f.level,uni:f.uni,major:f.major,year:f.year});S.setOn(true);S.act('Account created');S.go('dashboard')}
  else{if(S.user&&S.user.email===f.email.trim().toLowerCase()){S.setOn(true);S.act('Logged in');S.go('dashboard')}else setMsg('No demo account with this email in this browser. Register first, or use the demo account.')}};
 return <div className="grid min-h-screen md:grid-cols-2 fade">
  <div className="hidden bg-gradient-to-br from-navy to-[#0f5c68] p-10 text-white md:flex md:flex-col md:justify-between"><Logo dark/><div><h2 className="text-3xl font-bold">Find the path that fits you.</h2><p className="mt-2 text-slate-200">Take the assessment, see your matches and start your roadmap.</p></div><p className="text-xs text-slate-300">{S.cloud?'Secure sign-in powered by Supabase.':'Demo mode: accounts exist only in this browser.'}</p></div>
  <div className="flex items-center justify-center p-6"><form onSubmit={submit} className="w-full max-w-md space-y-3" noValidate>
   <button type="button" className="text-sm text-brand" onClick={()=>S.go('home')}>← Back to home</button>
   <h1 className="text-2xl font-bold text-navy">{reg?'Create your student account':'Welcome back'}</h1>
   {reg&&<Fld label="Full name" err={e.name}><input className={inp} value={f.name} onChange={set('name')}/></Fld>}
   <Fld label="Email" err={e.email}><input className={inp} type="email" value={f.email} onChange={set('email')}/></Fld>
   <Fld label="Password" err={e.password}><input className={inp} type="password" value={f.password} onChange={set('password')}/></Fld>
   {reg&&<><div className="grid grid-cols-2 gap-3"><Fld label="Country"><select className={inp} value={f.country} onChange={set('country')}>{['Pakistan','Other'].map(x=><option key={x}>{x}</option>)}</select></Fld>
   <Fld label="Education level"><select className={inp} value={f.level} onChange={set('level')}>{['Undergraduate','Graduate','Postgraduate','Fresh graduate'].map(x=><option key={x}>{x}</option>)}</select></Fld></div>
   <Fld label="University or college" err={e.uni}><input className={inp} value={f.uni} onChange={set('uni')}/></Fld>
   <div className="grid grid-cols-2 gap-3"><Fld label="Degree and major" err={e.major}><input className={inp} value={f.major} onChange={set('major')}/></Fld>
   <Fld label="Graduation year"><select className={inp} value={f.year} onChange={set('year')}>{[2025,2026,2027,2028,2029,2030].map(x=><option key={x}>{x}</option>)}</select></Fld></div></>}
   {msg&&<p className="rounded-lg bg-red-50 p-2 text-sm text-red-700">{msg}</p>}{info&&<p className="rounded-lg bg-brand-50 p-2 text-sm text-brand">{info}</p>}
   <B className="w-full" type="submit" disabled={busy}>{busy?'Please wait…':reg?'Create account':'Log in'}</B>
   {!reg&&<button type="button" className="block w-full text-center text-sm text-brand" onClick={()=>S.go('forgot')}>Forgot password?</button>}
   {!S.cloud&&<B v="o" className="w-full" type="button" onClick={()=>S.demo()}>Use demo account</B>}
   <p className="text-center text-sm text-slate-600">{reg?'Already registered? ':'New here? '}<button type="button" className="font-semibold text-brand" onClick={()=>S.go(reg?'login':'register')}>{reg?'Log in':'Create an account'}</button></p>
   {!S.cloud&&<p className="text-xs text-slate-500">Demo only: your password is checked but never saved.</p>}</form></div></div>;
}

const Head=({t,s,children})=><div className="mb-6 flex flex-wrap items-end justify-between gap-3"><div><h1 className="text-2xl font-bold text-navy">{t}</h1>{s&&<p className="text-sm text-slate-600">{s}</p>}</div>{children}</div>;

/* ---------- PROFILE ---------- */
const PF=['country','level','uni','major','year','subjects','exp','certs','short','long'];
const pct=p=>Math.round((PF.filter(k=>p[k]&&String(p[k]).trim()).length+(p.interests.length?1:0)+(Object.keys(p.skills).length?1:0))/12*100);
function Profile({S}){
 const p=S.profile,[ns,setNs]=useState(''),[nl,setNl]=useState(3),[ok,setOk]=useState(false),[dc,setDc]=useState(false);
 const set=k=>ev=>{setOk(false);S.setProfile({...p,[k]:ev.target.value})};
 const addS=()=>{const n=ns.trim();if(n){S.setProfile({...p,skills:{...p.skills,[n]:+nl}});setNs('')}};
 const tgl=i=>S.setProfile({...p,interests:p.interests.includes(i)?p.interests.filter(x=>x!==i):[...p.interests,i]});
 return <Shell S={S} page="profile"><Head t="My Profile" s={'Profile completion: '+pct(p)+'%'}><B onClick={async()=>{const e=await S.saveProfile();if(e){setOk('Could not save: '+e);return}S.act('Profile saved');setOk(true)}}>Save profile</B></Head>
 {ok&&<p className="mb-4 rounded-lg bg-brand-50 p-2 text-sm text-brand">{ok===true?(S.cloud?'Profile saved to your account.':'Profile saved in this browser.'):ok}</p>}
 <div className="grid gap-4 md:grid-cols-2">
 <Card className="space-y-3"><h2 className="font-bold text-navy">Account</h2><Fld label="Name"><input className={inp} value={S.user.name} onChange={ev=>S.setUser({...S.user,name:ev.target.value})}/></Fld><p className="text-sm text-slate-600">Email: {S.user.email}</p>
  <Fld label="Country"><select className={inp} value={p.country} onChange={set('country')}>{['','Pakistan','Other'].map(x=><option key={x}>{x}</option>)}</select></Fld>
  <Fld label="Education level"><select className={inp} value={p.level} onChange={set('level')}>{['','Undergraduate','Graduate','Postgraduate','Fresh graduate'].map(x=><option key={x}>{x}</option>)}</select></Fld></Card>
 <Card className="space-y-3"><h2 className="font-bold text-navy">Academic background</h2>{[['uni','University or college'],['major','Degree and major'],['year','Graduation year'],['subjects','Subjects you enjoy']].map(([k,l])=><Fld key={k} label={l}><input className={inp} value={p[k]} onChange={set(k)}/></Fld>)}</Card>
 <Card><h2 className="mb-2 font-bold text-navy">Interests</h2><div className="flex flex-wrap gap-2">{INDS.map(i=><Chip key={i} on={p.interests.includes(i)} onClick={()=>tgl(i)}>{i}</Chip>)}</div></Card>
 <Card><h2 className="mb-2 font-bold text-navy">Skills (self-rated 1–5)</h2><div className="mb-3 flex gap-2"><input className={inp} placeholder="e.g. Excel" value={ns} onChange={ev=>setNs(ev.target.value)} onKeyDown={ev=>ev.key==='Enter'&&addS()}/><select className={inp+' !w-20'} value={nl} onChange={ev=>setNl(ev.target.value)}>{[1,2,3,4,5].map(x=><option key={x}>{x}</option>)}</select><B onClick={addS}>Add</B></div>
  {Object.keys(p.skills).length?<div className="flex flex-wrap gap-2">{Object.entries(p.skills).map(([k,v])=><span key={k} className="rounded-full bg-mist px-3 py-1 text-sm">{k} · {v}/5 <button aria-label={'Remove '+k} className="ml-1 text-red-600" onClick={()=>{const s={...p.skills};delete s[k];S.setProfile({...p,skills:s})}}>×</button></span>)}</div>:<p className="text-sm text-slate-500">No skills yet. Add your first one above.</p>}</Card>
 <Card className="space-y-3 md:col-span-2"><h2 className="font-bold text-navy">Experience and goals</h2>

 <Card className="mt-4 border-red-200"><h2 className="font-bold text-navy">Delete my account</h2><p className="my-2 text-sm text-slate-600">This permanently removes your account and all your saved data. It cannot be undone.</p><B v="o" className="!border-red-300 !text-red-700" onClick={async()=>{if(!dc){setDc(true);return}const e=await S.delAcct();if(e)setOk('Could not delete: '+e)}}>{dc?'Click again to permanently delete':'Delete my account'}</B></Card></Shell>;

function Discover({S}){
 const init=S.ans||{r:[3,3,3,3,3,3,3],inds:[],env:'Office',subjects:'',goal:''};
 const [a,setA]=useState(init),[st,setSt]=useState(0),[er,setEr]=useState('');
 const next=()=>{if(st===1&&!a.inds.length){setEr('Pick at least one industry.');return}setEr('');setSt(st+1)};
 const fin=()=>{S.setAns(a);S.act('Completed career assessment');S.go('results')};
 return <Shell S={S} page="discover"><Head t="AI Career Discovery" s={'Step '+(st+1)+' of 3 · takes about 2 minutes'}/><Bar pct={(st+1)/3*100}/>
 <Card className="mt-4">
 {st===0&&<div className="space-y-4"><h2 className="font-bold text-navy">How strong are you in each area?</h2><p className="text-sm text-slate-600">1 = just starting, 5 = very strong. Be honest: this makes your results better.</p>
  {DIMS.map((d,i)=><div key={d}><div className="flex justify-between text-sm"><span>{d}</span><b>{a.r[i]}</b></div><input type="range" min="1" max="5" value={a.r[i]} className="w-full accent-teal-600" onChange={ev=>setA({...a,r:a.r.map((x,j)=>j===i?+ev.target.value:x)})}/></div>)}</div>}
 {st===1&&<div className="space-y-4"><h2 className="font-bold text-navy">Which industries interest you?</h2><div className="flex flex-wrap gap-2">{INDS.map(i=><Chip key={i} on={a.inds.includes(i)} onClick={()=>setA({...a,inds:a.inds.includes(i)?a.inds.filter(x=>x!==i):[...a.inds,i]})}>{i}</Chip>)}</div>
  <h2 className="font-bold text-navy">Preferred working environment</h2><div className="flex flex-wrap gap-2">{ENVS.map(i=><Chip key={i} on={a.env===i} onClick={()=>setA({...a,env:i})}>{i}</Chip>)}</div></div>}

/* ---------- RESULTS ---------- */

 <div className="space-y-4">{rk.map(({c,s},i)=>{const why=c.p.map((v,j)=>[j,v]).filter(([j])=>Math.abs(S.ans.r[j]-c.p[j])<=1).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([j])=>DIMS[j].toLowerCase());const ind=c.inds.filter(x=>S.ans.inds.includes(x));

  <div className="my-2"><Bar pct={s.total}/></div><p className="text-sm text-slate-700">{c.d}</p>
  <p className="mt-2 text-sm"><b>Why it matches:</b> {why.length?'your ratings closely fit this career’s needs for '+why.join(' and ')+'. ':''}{ind.length?'You selected '+ind.join(', ')+'.':'It does not overlap with your chosen industries.'}</p>
  {open===c.id&&<div className="mt-3 grid gap-3 border-t pt-3 text-sm md:grid-cols-2 fade"><div><b>Required qualifications</b><p>{c.q}</p><b className="mt-2 block">Essential skills</b><p>{c.sk.map(x=>x[0]).join(', ')}</p><b className="mt-2 block">Career opportunities</b><p>{c.jobs}</p></div><div><b>Industries</b><p>{c.inds.join(', ')}</p><b className="mt-2 block">Suggested next steps</b><ul className="list-disc pl-5">{c.next.map(n=><li key={n}>{n}</li>)}</ul><b className="mt-2 block">Score breakdown</b><p>Skill fit {Math.round(s.fit*100)}% · Industry {Math.round(s.ov*100)}% · Work style {Math.round(s.env*100)}%</p></div></div>}
  <div className="mt-3 flex flex-wrap gap-2"><B v="o" onClick={()=>setOpen(open===c.id?null:c.id)}>{open===c.id?'Hide details':'View details'}</B><B onClick={()=>{S.setGoal(c.id);S.act('Set career goal: '+c.t);S.go('gap')}}>Set as my goal</B>{S.goal===c.id&&<span className="self-center text-sm font-semibold text-brand">✓ Current goal</span>}</div></Card>})}</div></Shell>;
}
const Picker=({S})=><select className={inp+' !w-auto'} value={S.goal||''} onChange={ev=>{S.setGoal(ev.target.value);S.act('Set career goal: '+byId(ev.target.value).t)}}><option value="" disabled>Choose a career</option>{CAREERS.map(c=><option key={c.id} value={c.id}>{c.t}</option>)}</select>;

/* ---------- SKILL GAP ---------- */
function Gap({S}){
 const c=byId(S.goal),sk=S.profile.skills;
 return <Shell S={S} page="gap"><Head t="Skill Gap Analyzer" s="Rate yourself, then see what to learn first"><Picker S={S}/></Head>
 {!c?<Card className="py-10 text-center text-slate-600">Choose a career above to compare your skills.</Card>:(()=>{
  const rows=c.sk.map(([n,req,pr])=>{const kk=Object.keys(sk).find(x=>x.toLowerCase()===n.toLowerCase()),have=kk?sk[kk]:0,gap=Math.max(0,req-have);return{n,k:kk||n,req,pr,have,gap,pri:gap>=3?'High':gap===2?'Medium':gap===1?'Low':'Met'}});
  const rd=Math.round(rows.reduce((s,r)=>s+Math.min(r.have,r.req),0)/rows.reduce((s,r)=>s+r.req,0)*100);
  const col={High:'bg-red-100 text-red-700',Medium:'bg-amber-100 text-amber-800',Low:'bg-sky-100 text-sky-700',Met:'bg-emerald-100 text-emerald-700'};
  return <><Card className="mb-4 flex items-center gap-5"><Ring pct={rd}/><div><h2 className="font-bold text-navy">{c.t}: skill readiness</h2><p className="text-sm text-slate-600">{rows.filter(r=>r.gap>0).length} of {rows.length} skills need work. Required levels are <b>sample data</b>.</p><div className="mt-2 flex gap-4 text-xs"><span className="flex items-center gap-1"><i className="h-2.5 w-4 rounded bg-navy"/>Required</span><span className="flex items-center gap-1"><i className="h-2.5 w-4 rounded bg-brand"/>You</span></div></div></Card>
  <div className="space-y-3">{rows.map(r=><Card key={r.n}><div className="flex flex-wrap items-center justify-between gap-2"><b className="text-navy">{r.n}</b><span className={'rounded-full px-2 py-0.5 text-xs font-semibold '+col[r.pri]}>{r.pri==='Met'?'Skill met':r.pri+' priority'}</span></div>
   <div className="my-2 space-y-1"><Bar pct={r.req*20} color="bg-navy"/><Bar pct={r.have*20}/></div>
   <label className="flex items-center gap-3 text-sm">Your level: <b>{r.have}/5</b><input type="range" min="0" max="5" value={r.have} className="flex-1 accent-teal-600" onChange={ev=>{const v=+ev.target.value,s={...sk};if(v)s[r.k]=v;else delete s[r.k];S.setProfile({...S.profile,skills:s})}}/></label>
   {r.gap>0&&<div className="mt-2 grid gap-1 text-sm text-slate-700 md:grid-cols-2"><p><b>Learn:</b> search “{r.n} for beginners” on Coursera, edX or YouTube <span className="text-xs text-slate-400">(suggestion, not a verified course)</span></p><p><b>Practice project:</b> {r.pr}</p></div>}</Card>)}</div>
  <B className="mt-4" onClick={()=>S.go('roadmap')}>Build my roadmap →</B></>})()}</Shell>;
}

/* ---------- ROADMAP ---------- */
function Roadmap({S}){

 const tk=c?tasks(c):null,all=c?PHASES.flatMap(([k])=>tk[k].map((_,i)=>c.id+':'+k+':'+i)):[];
 const n=all.filter(k=>S.done[k]).length,p=all.length?Math.round(n/all.length*100):0;
 return <Shell S={S} page="roadmap"><Head t="Career Roadmap" s="Tick activities as you finish them"><Picker S={S}/></Head>
 {!c?<Card className="py-10 text-center text-slate-600">Choose a career above to see your roadmap.</Card>:<>
 <Card className="mb-4 flex items-center gap-5"><Ring pct={p}/><div><h2 className="font-bold text-navy">{c.t} roadmap</h2><p className="text-sm text-slate-600">{n} of {all.length} activities done. Template plan (<Demo/>); AI-personalised plans arrive in Stage 3.</p></div></Card>
 <div className="space-y-4">{PHASES.map(([k,l])=>{const dn=tk[k].filter((_,i)=>S.done[c.id+':'+k+':'+i]).length;return <Card key={k}><div className="mb-2 flex justify-between"><h3 className="font-bold text-navy">{l}</h3><span className="text-sm text-slate-500">{dn}/{tk[k].length}</span></div>
  {tk[k].map((t,i)=>{const key=c.id+':'+k+':'+i;return <label key={key} className="flex cursor-pointer items-start gap-3 rounded-lg px-2 py-2 hover:bg-mist"><input type="checkbox" className="mt-1 h-4 w-4 accent-teal-600" checked={!!S.done[key]} onChange={()=>{S.setDone({...S.done,[key]:!S.done[key]});if(!S.done[key])S.act('Completed: '+t)}}/><span className={'text-sm '+(S.done[key]?'text-slate-400 line-through':'')}>{t}</span></label>})}</Card>})}</div></>}</Shell>;
}

   {rk.length?rk.map(({c:x,s})=><div key={x.id} className="mb-2"><div className="flex justify-between text-sm"><span>{x.t}</span><b>{s}%</b></div><Bar pct={s}/></div>):<p className="text-sm text-slate-500">Take the assessment to see your top matches.</p>}</Card>

}

/* ---------- STAGE 7: CV, INTERVIEW, COMPARE ---------- */
const QG=['Tell me about yourself.','Why are you interested in this career?','Describe a time you worked in a team. What did you do?','Describe a problem you solved and how you solved it.','Where do you see yourself in five years?'];
const QC={data:['How would you explain a data finding to a non-technical manager?','How do you clean a messy dataset?'],dev:['How do you break a big coding problem into smaller steps?','Tell me about a project you built.'],ux:['How do you find out what users really need?','Walk me through a design you made.'],mkt:['How would you grow a small page from 0 to 1,000 followers?','How do you measure if a campaign worked?'],eco:['How would you explain inflation to a village shopkeeper?','Which data would you use to study unemployment?'],pm:['How do you handle a team member who misses deadlines?','How do you plan a project with a small budget?'],fin:['How would you check if a company is a good investment?','What would you do if your spreadsheet totals do not match?']};
const STAR=['situation','task','action','result','because','i led','i built','i organised','i organized','i created','i planned','i analysed','i analyzed'];
function rate(a,c){const w=a.trim().split(/\s+/).filter(Boolean).length,l=' '+a.toLowerCase();
 const sk=c.sk.filter(s=>l.includes(s[0].toLowerCase().split(' ')[0])).length,st=STAR.filter(k=>l.includes(k)).length,fill=/\b(um|uh|like,|you know|whatever|stuff|basically)\b/.test(l);
 const R=[['Length (40–150 words)',w>=40&&w<=150?2:w>=20?1:0,'Aim for 40–150 words.'],['Structure (what you did and the result)',st>=2?2:st?1:0,'Use the STAR method: Situation, Task, Action, Result.'],['Specific example or number',/\d/.test(a)||/for example|for instance|when i /.test(l)?2:0,'Add a real example or a number, such as “raised sign-ups by 20%”.'],['Career skills mentioned',sk>=2?2:sk?1:0,'Mention skills this career needs, such as '+c.sk.slice(0,3).map(s=>s[0]).join(', ')+'.'],['Professional tone',fill||w<8?0:2,'Avoid filler words and use complete sentences.']];
 return{pts:R.reduce((s,r)=>s+r[1],0),R}}
function Interview({S}){
 const [cid,setCid]=useState(S.goal||'data'),[qi,setQi]=useState(0),[a,setA]=useState(''),[res,setRes]=useState(null);
 const c=byId(cid),qs=[...(QC[cid]||[]),...QG];
 return <Shell S={S} page="interview"><Head t="Interview Coach" s="Practise one question at a time"/>
 <Card className="mb-4 border-amber-300 bg-amber-50 text-sm text-amber-900"><b>How scoring works:</b> a fixed 5-point rubric (2 points each, 10 in total) checks length, structure, a specific example, career skills and tone. It is <b>not AI</b>, so it cannot judge if your answer is true or good. AI feedback comes in a later stage. Questions are sample questions.</Card>
 <Card className="space-y-3"><Fld label="Career or job position"><select className={inp} value={cid} onChange={ev=>{setCid(ev.target.value);setQi(0);setA('');setRes(null)}}>{CAREERS.map(x=><option key={x.id} value={x.id}>{x.t}</option>)}</select></Fld>
  <p className="text-xs font-semibold text-brand">Question {qi+1} of {qs.length}</p><p className="text-lg font-bold text-navy">{qs[qi]}</p>
  <textarea rows="6" className={inp} placeholder="Type your answer here" value={a} onChange={ev=>{setA(ev.target.value);setRes(null)}}/>
  <div className="flex flex-wrap gap-2"><B disabled={a.trim().length<5} onClick={()=>{setRes(rate(a,c));S.act('Practised interview: '+c.t)}}>Evaluate my answer</B><B v="o" onClick={()=>{setQi((qi+1)%qs.length);setA('');setRes(null)}}>Next question</B></div></Card>
 {res&&<Card className="mt-4"><div className="flex items-center gap-5"><Ring pct={res.pts*10}/><div><h2 className="font-bold text-navy">Score: {res.pts} / 10</h2><p className="text-sm text-slate-600">{res.pts>=8?'Strong answer.':res.pts>=5?'Good start. Improve the points below.':'Needs work. Follow the tips below.'}</p></div></div>
  <div className="mt-3 space-y-2">{res.R.map(([n,p,t])=><div key={n} className="rounded-lg bg-mist p-3 text-sm"><div className="flex justify-between"><b>{n}</b><span>{p}/2</span></div>{p<2&&<p className="mt-1 text-slate-600">Tip: {t}</p>}</div>)}</div>
  <p className="mt-3 text-sm"><b>A stronger answer</b> opens with one sentence of context, explains your action in two or three sentences, and ends with the result and what you learned.</p></Card>}</Shell>;
}
function CV({S}){
 const p=S.profile;
 const init={name:S.user.name,email:S.user.email,phone:'',summary:'',edu:[p.major,p.uni,p.year].filter(Boolean).join(', '),skills:Object.keys(p.skills).join(', '),exp:p.exp||'',certs:p.certs||'',t:'Classic'};
 const [cv,setCv]=useState(()=>LS.get('cv',null)||init);
 const up=k=>ev=>{const n={...cv,[k]:ev.target.value};setCv(n);LS.set('cv',n)};
 const w=x=>x.trim().split(/\s+/).filter(Boolean).length,sg=[];
 if(w(cv.summary)<25)sg.push('Write a 2–3 sentence summary (at least 25 words) about who you are and the job you want.');
 if(cv.skills.split(',').filter(x=>x.trim()).length<5)sg.push('List at least 5 relevant skills, separated by commas.');
 if(!cv.exp.trim())sg.push('Add experience, such as internships, volunteering or society roles.');else if(!/\d/.test(cv.exp))sg.push('Add numbers to your experience (for example “led a team of 10”).');
 if(!cv.certs.trim())sg.push('Add any certificates or courses you have completed.');
 if(!cv.phone.trim())sg.push('Add a phone number so employers can reach you.');
 const H=({children})=><h3 className={'mt-4 mb-1 text-xs font-bold uppercase tracking-wide '+(cv.t==='Modern'?'text-brand':'border-b border-slate-400 text-slate-900')}>{children}</h3>;
 return <Shell S={S} page="cv"><Head t="CV Builder" s="Fill in your details and download a PDF"><B onClick={()=>window.print()}>Download PDF</B></Head>
 <p className="mb-4 text-xs text-slate-500">Your draft is saved in this browser only. The tips below are rule-based, not AI. In the print window, choose “Save as PDF” as the destination.</p>
 <div className="grid gap-4 md:grid-cols-2"><div className="space-y-3"><Card className="space-y-3"><Fld label="Template"><select className={inp} value={cv.t} onChange={up('t')}><option>Classic</option><option>Modern</option></select></Fld>
  {[['name','Full name'],['email','Email'],['phone','Phone'],['edu','Education']].map(([k,l])=><Fld key={k} label={l}><input className={inp} value={cv[k]} onChange={up(k)}/></Fld>)}
  {[['summary','Professional summary'],['skills','Skills (comma separated)'],['exp','Experience'],['certs','Certifications']].map(([k,l])=><Fld key={k} label={l}><textarea rows="3" className={inp} value={cv[k]} onChange={up(k)}/></Fld>)}</Card>
  <Card><h2 className="font-bold text-navy">Improvement tips</h2>{sg.length?<ul className="mt-2 list-disc space-y-1 pl-5 text-sm">{sg.map(x=><li key={x}>{x}</li>)}</ul>:<p className="mt-2 text-sm text-emerald-700">No tips left. Your CV covers the basics.</p>}<p className="mt-2 text-xs text-slate-500">ATS-friendly: one column, plain headings and no pictures, so hiring software can read it.</p></Card></div>
 <div id="cvprev" className={'rounded-2xl border bg-white p-6 text-sm text-slate-900 '+(cv.t==='Classic'?'font-serif':'')}><h1 className="text-2xl font-bold">{cv.name||'Your name'}</h1><p className="text-slate-600">{[cv.email,cv.phone].filter(Boolean).join(' · ')}</p>
  {cv.summary&&<><H>Summary</H><p>{cv.summary}</p></>}{cv.edu&&<><H>Education</H><p>{cv.edu}</p></>}{cv.skills&&<><H>Skills</H><p>{cv.skills}</p></>}{cv.exp&&<><H>Experience</H><p className="whitespace-pre-line">{cv.exp}</p></>}{cv.certs&&<><H>Certifications</H><p className="whitespace-pre-line">{cv.certs}</p></>}</div></div></Shell>;
}
function Compare({S}){
 const [ids,setIds]=useState([S.goal||'data','eco','']);
 const sel=ids.map(byId).filter(Boolean);
 const top=c=>c.p.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).slice(0,2).map(x=>DIMS[x[1]]).join(', ');
 const rows=[['Education',c=>c.q,'Sample'],['Key skills',c=>c.sk.map(x=>x[0]).join(', '),'Sample'],['Career opportunities',c=>c.jobs,'Sample'],['Industries',c=>c.inds.join(', '),'Sample'],['Work environment',c=>c.env.join(', '),'Sample'],['Strongest traits',top,'Sample'],['Salary',()=>'Not verified: no salary data source is connected yet.','Not verified'],['Growth prospects',()=>'Not verified: no labour-market data is connected yet.','Not verified']];
 return <Shell S={S} page="compare"><Head t="Career Comparison" s="Compare up to three careers"/>
 <Card className="mb-4 border-amber-300 bg-amber-50 text-sm text-amber-900"><b>Sample data:</b> these career profiles were written for this prototype, not taken from official statistics. Salary and growth are left empty on purpose until a verified source is connected.</Card>
 <Card className="mb-4"><div className="grid gap-3 md:grid-cols-3">{ids.map((v,i)=><Fld key={i} label={'Career '+(i+1)}><select className={inp} value={v} onChange={ev=>setIds(ids.map((x,j)=>j===i?ev.target.value:x))}><option value="">None</option>{CAREERS.map(x=><option key={x.id} value={x.id}>{x.t}</option>)}</select></Fld>)}</div></Card>
 {!sel.length?<Card className="py-10 text-center text-slate-600">Choose at least one career to compare.</Card>:<Card className="overflow-x-auto"><table className="w-full min-w-[600px] text-left text-sm"><thead><tr><th className="p-2"></th>{sel.map(c=><th key={c.id} className="p-2 text-navy">{c.t}</th>)}</tr></thead><tbody>{rows.map(([n,f,tg])=><tr key={n} className="border-t align-top"><td className="p-2 font-semibold">{n}<br/><span className={'text-xs '+(tg==='Sample'?'text-amber-700':'text-slate-400')}>{tg}</span></td>{sel.map(c=><td key={c.id} className="p-2">{f(c)}</td>)}</tr>)}</tbody></table></Card>}</Shell>;
}

/* ---------- APP ---------- */
function App(){
 const [page,setPage]=useState((location.hash||'#home').slice(1));
 const [user,setUser]=useStore('user',null);
 const [on,setOn]=useStore('in',false);
 const [sv,setSv]=useStore('saved',{s:[],i:[]});
 const [uid,setUid]=useState(null),[loaded,setLoaded]=useState(false),[net,setNet]=useState('');const cur=React.useRef(null);
 const [profile,setProfile]=useStore('profile',{country:'',level:'',uni:'',major:'',year:'',subjects:'',exp:'',certs:'',short:'',long:'',interests:[],skills:{}});
 const [ans,setAns]=useStore('answers',null);
 const [goal,setGoal]=useStore('goal','');
 const [done,setDone]=useStore('done',{});
 const [acts,setActs]=useStore('acts',[]);
 useEffect(()=>{const f=()=>{setPage((location.hash||'#home').slice(1));window.scrollTo(0,0)};addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);
 const go=p=>{setPage(p);window.scrollTo(0,0);try{location.hash=p}catch(e){}};
 const act=t=>{setActs(a=>[{t,d:new Date().toLocaleString()},...a].slice(0,20));if(SB&&uid)SB.from('activity').insert({user_id:uid,message:t}).then(()=>{})};
 const blank={country:'',level:'',uni:'',major:'',year:'',subjects:'',exp:'',certs:'',short:'',long:'',interests:[],skills:{}};
 const wipe=()=>{setAns(null);setGoal('');setDone({});setActs([]);setSv({s:[],i:[]});LS.set('cv',null)};
 const demo=()=>{if(!user||user.email!=='demo@futurepath.test'){wipe();setProfile({...blank,country:'Pakistan',level:'Undergraduate',uni:'Sample University',major:'BS Economics',year:'2027',subjects:'Economics, Statistics',interests:['Development & NGOs','Finance'],skills:{Excel:3,Communication:3}})}setUser({name:'Demo Student',email:'demo@futurepath.test'});setOn(true);act('Opened demo account');go('dashboard')};
 const cloud=!!SB;
 const clearLocal=()=>{setLoaded(false);wipe();setProfile(blank);setUser(null);setOn(false)};
 const logout=async()=>{if(SB){await SB.auth.signOut();cur.current=null;setUid(null);clearLocal()}else setOn(false);go('home')};
 const delAcct=async()=>{if(!SB){wipe();setProfile(blank);setUser(null);setOn(false);go('home');return null}const {error}=await SB.rpc('delete_my_account');if(error)return error.message;await SB.auth.signOut();cur.current=null;setUid(null);clearLocal();go('home');return null};
 const profRow=()=>({id:uid,full_name:user&&user.name,email:user&&user.email,country:profile.country,education_level:profile.level,university:profile.uni,major:profile.major,graduation_year:profile.year,subjects:profile.subjects,experience:profile.exp,certifications:profile.certs,short_goal:profile.short,long_goal:profile.long,interests:profile.interests,skills:profile.skills,career_goal:goal||null});
 const saveProfile=async()=>{if(!SB||!uid)return null;const {error}=await SB.from('profiles').upsert(profRow());return error?error.message:null};
 const cloudAuth=async(reg,f)=>{const email=f.email.trim().toLowerCase();
  if(reg){const {data,error}=await SB.auth.signUp({email,password:f.password,options:{emailRedirectTo:location.origin+'/',data:{full_name:f.name.trim(),country:f.country,education_level:f.level,university:f.uni.trim(),major:f.major.trim(),graduation_year:f.year}}});
   if(error)return{msg:error.message};if(data.session){go('dashboard');return{ok:'Account created. Loading your dashboard…'}}
   return{ok:'Almost done! We sent a confirmation link to '+email+'. Open it, then come back here and log in.'}}
  const {error}=await SB.auth.signInWithPassword({email,password:f.password});if(error)return{msg:error.message};go('dashboard');return{}};
 const q=p=>p.then(({error})=>{if(error)setNet('Could not save to your account: '+error.message)});
 useEffect(()=>{if(!SB)return;
  const load=async u=>{if(cur.current===u.id)return;cur.current=u.id;setUid(u.id);const m=u.user_metadata||{};
   try{const [pr,as,rm,sv2,ac]=await Promise.all([SB.from('profiles').select('*').eq('id',u.id).maybeSingle(),SB.from('assessments').select('answers').eq('user_id',u.id).maybeSingle(),SB.from('roadmap_progress').select('done').eq('user_id',u.id).maybeSingle(),SB.from('saved_items').select('kind,item_id').eq('user_id',u.id),SB.from('activity').select('message,created_at').eq('user_id',u.id).order('created_at',{ascending:false}).limit(20)]);
    const bad=[pr,as,rm,sv2,ac].find(x=>x.error);if(bad)throw new Error(bad.error.message);
    const r=pr.data||{};setUser({name:r.full_name||m.full_name||u.email,email:u.email});
    setProfile({...blank,country:r.country||m.country||'',level:r.education_level||m.education_level||'',uni:r.university||m.university||'',major:r.major||m.major||'',year:r.graduation_year||m.graduation_year||'',subjects:r.subjects||'',exp:r.experience||'',certs:r.certifications||'',short:r.short_goal||'',long:r.long_goal||'',interests:r.interests||[],skills:r.skills||{}});
    setGoal(r.career_goal||'');setAns(as.data?as.data.answers:null);setDone(rm.data?rm.data.done:{});
    const rows=sv2.data||[];setSv({s:rows.filter(x=>x.kind==='scholarship').map(x=>x.item_id),i:rows.filter(x=>x.kind==='internship').map(x=>x.item_id)});
    setActs((ac.data||[]).map(a=>({t:a.message,d:new Date(a.created_at).toLocaleString()})));setNet('');setOn(true);setLoaded(true)}
   catch(e){cur.current=null;setNet('Could not load your data: '+e.message)}};
  SB.auth.getSession().then(({data})=>{if(data.session)load(data.session.user);else clearLocal()});

  return()=>sub.subscription.unsubscribe()},[]);
 useEffect(()=>{if(!cloud||!loaded)return;const t=setTimeout(()=>q(SB.from('profiles').upsert(profRow())),600);return()=>clearTimeout(t)},[profile,goal,user]);
 useEffect(()=>{if(!cloud||!loaded||!ans)return;const t=setTimeout(()=>{q(SB.from('assessments').upsert({user_id:uid,answers:ans}));q(SB.from('recommendations').upsert({user_id:uid,results:CAREERS.map(c=>({id:c.id,score:score(c,ans).total})).sort((a,b)=>b.score-a.score).slice(0,5),method:'sample-formula-v1'}))},600);return()=>clearTimeout(t)},[ans]);
 useEffect(()=>{if(!cloud||!loaded)return;const t=setTimeout(()=>q(SB.from('roadmap_progress').upsert({user_id:uid,done})),600);return()=>clearTimeout(t)},[done]);
 useEffect(()=>{if(!cloud||!loaded)return;const t=setTimeout(async()=>{await SB.from('saved_items').delete().eq('user_id',uid);const rows=[...sv.s.map(x=>({user_id:uid,kind:'scholarship',item_id:x})),...sv.i.map(x=>({user_id:uid,kind:'internship',item_id:x}))];if(rows.length)q(SB.from('saved_items').insert(rows))},600);return()=>clearTimeout(t)},[sv]);
 const S={cloud,net,uid,cloudAuth,logout,delAcct,saveProfile,go,user,setUser,on,setOn,blank,wipe,sv,setSv,profile,setProfile,ans,setAns,goal,setGoal,done,setDone,acts,act,demo};
 const prot=['dashboard','profile','discover','results','gap','roadmap','scholar','intern','cv','interview','compare'];
 if(cloud&&uid&&!loaded&&prot.includes(page))return <div className="grid min-h-screen place-items-center text-slate-600">Loading your account…</div>;
 if(prot.includes(page)&&!(user&&on))return <Auth S={S} mode="login" key="login"/>;

 if(page==='profile')return <Profile S={S}/>;
 if(page==='discover')return <Discover S={S}/>;
 if(page==='results')return <Results S={S}/>;
 if(page==='gap')return <Gap S={S}/>;
 if(page==='roadmap')return <Roadmap S={S}/>;
 if(page==='scholar')return <Scholar S={S}/>;
 if(page==='intern')return <Intern S={S}/>;
 if(page==='cv')return <CV S={S}/>;
 if(page==='interview')return <Interview S={S}/>;
 if(page==='compare')return <Compare S={S}/>;
 if(page==='forgot')return <Forgot S={S}/>;
 if(page==='reset')return <Reset S={S}/>;
 return <Landing S={S}/>;
}

</script>
